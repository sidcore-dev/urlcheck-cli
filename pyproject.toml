[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urlcheck-cli"
version = "1.0.0"
description = "Check a list of URLs, or URLs embedded in a Markdown file, and report status codes or errors."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "sidcore-dev" }]
keywords = ["url", "link-checker", "cli", "devtools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
urlcheck-cli = "urlcheck_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
